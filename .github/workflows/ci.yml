name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node 20 is the floor: the baileys sandbox driver refuses to install
        # on 18 ("requires Node.js 20+ to run reliably"), and 18 has been
        # end-of-life since April 2025.
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install root dependencies
        run: npm ci

      - name: Run unit tests
        # --maxWorkers is forced well above the runner's core count: this repo's
        # test suite has dozens of files that mock bot/shared/config/supabase
        # per-file (jest.mock inside the test rather than a shared __mocks__),
        # and under low worker counts too many of those pile into one worker
        # process, where the per-file mock intercept becomes unreliable —
        # confirmed locally as a real, reproducible dose-response (33-50%
        # failure rate at 1-2 workers, occasional residual flakes still seen
        # at 8 workers, 0/5+ runs at 16 workers). More workers means fewer
        # files share a process, not more raw parallelism per se — safe to
        # over-provision well past the runner's core count for a suite this
        # lightweight (full run finishes in ~17s even at 16 workers).
        run: npm test -- --maxWorkers=16

      - name: Install canvas system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev librsvg2-dev libpixman-1-dev

      - name: Install bot dependencies
        working-directory: bot
        run: npm ci

      - name: Verify no hardcoded credentials
        run: |
          # Check for common credential patterns in source files. The `!` in
          # front of the grep inverts the exit code: grep returns 0 on a hit
          # (which means the credential leaked), and the `!` flips that to a
          # non-zero exit so the step fails. The trailing `|| true` was a
          # defensive mistake that silently masked any hit; removed so a
          # real leak now actually fails CI.
          ! grep -rn 'EAAUmy\|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.' \
            --include='*.js' --include='*.ts' --include='*.json' \
            --exclude-dir=node_modules --exclude-dir=.git \
            bot/shared/ dashboard/ portal/ scripts/ infrastructure/

  python:
    # The Python packages (the Morning Brief in brief/, the curriculum builder in curriculum/) carry
    # their own offline unittest suites — fakes only, no database, no network.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the brief's dependencies
        run: pip install matplotlib numpy

      - name: Morning Brief tests
        run: python3 -m unittest discover -s brief/tests -t brief -p 'test_*.py'

      - name: Curriculum tests
        run: |
          python3 -m unittest discover curriculum/tools -p 'test_*.py'
          python3 curriculum/gates/test_qa_checks.py
          python3 curriculum/test_cli.py
          python3 curriculum/graph/test_build_graph.py

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm ci

      - name: Check for security patterns
        run: |
          echo "Checking for hardcoded secrets..."
          FOUND=0
          # Check for API keys
          if grep -rn 'sk-[a-zA-Z0-9]\{20,\}' --include='*.js' --exclude-dir=node_modules --exclude='*.test.js' bot/shared/ dashboard/services/ 2>/dev/null; then
            echo "WARNING: Possible API key found"
            FOUND=1
          fi
          # Check for personal paths
          if grep -rn '/Users/' --include='*.js' --include='*.sh' --exclude-dir=node_modules bot/ dashboard/ 2>/dev/null; then
            echo "WARNING: Personal path found"
            FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then
            echo "Security check found potential issues. Review above."
            exit 1
          fi
          echo "Security check passed."
